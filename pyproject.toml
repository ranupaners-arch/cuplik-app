[project]
name = "cuplik"
version = "0.1.0"
description = "Fondasi end-to-end Cuplik: API, antrean, LLM, dan render video"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "redis>=5,<7",
  "rq>=2.3,<3",
  "sse-starlette>=2.2,<4",
  "httpx>=0.28,<1",
  "yt-dlp[default]>=2025.1",
  "numpy>=2,<3",
  "scenedetect-headless>=0.7.3,<0.8",
  "jinja2>=3.1.6,<4",
  "pillow>=12.1.1,<14",
]

[project.optional-dependencies]
# faster-whisper 1.2.1 still passes metadata_errors to PyAV; PyAV 19 removed it.
transcription = ["faster-whisper>=1.1,<2", "av>=11,<19"]
mlx = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'", "webrtcvad-wheels>=2.0.14,<3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
