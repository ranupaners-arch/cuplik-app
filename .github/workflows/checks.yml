name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg redis-server
      - run: make install
      - run: make lint test build
      - run: make eval eval-fixtures
      - run: make types && git diff --exit-code -- docs/openapi.json web/src/lib/api.generated.ts
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: android/third_party/whisper.cpp
          persist-credentials: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: npm ci --prefix web
      - run: npm run build:android-ui --prefix web
      - run: cp android/third_party/whisper.cpp/LICENSE android/app/src/main/assets/whisper-LICENSE.txt
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
        working-directory: android
      - name: Prepare native pipeline fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          mkdir -p android/app/src/androidTest/assets
          espeak-ng -w /tmp/cuplik-speech.wav "This is a video editing test. We prepare the tools, follow each step, and check the result carefully."
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=24:duration=8 -i /tmp/cuplik-speech.wav -af apad -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac android/app/src/androidTest/assets/source.mp4
          curl --fail --location --retry 3 https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin -o android/app/src/androidTest/assets/ggml-tiny.bin
          echo 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  android/app/src/androidTest/assets/ggml-tiny.bin' | sha256sum --check
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cuplik-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-failure-reports
          path: android/app/build/reports
  foundation:
    if: always()
    needs: [web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$ANDROID_RESULT" = success
