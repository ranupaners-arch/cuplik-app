name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_signed_apk:
        description: Build a signed APK after all validation succeeds (owner only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure media tools
        timeout-minutes: 9
        run: bash scripts/ci_system_packages.sh ffmpeg redis-server
      - run: make install
      - run: make lint test build
      - run: make eval eval-fixtures
      - run: make types && git diff --exit-code -- docs/openapi.json web/src/lib/api.generated.ts
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e
      - run: npm run test:android-ui --prefix web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: android/third_party/whisper.cpp
          persist-credentials: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: npm ci --prefix web
      - run: npm run build:android-ui --prefix web
      - run: cp android/third_party/whisper.cpp/LICENSE android/app/src/main/assets/whisper-LICENSE.txt
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
        working-directory: android
      - name: Prepare native pipeline fixture
        timeout-minutes: 9
        run: |
          bash scripts/ci_system_packages.sh ffmpeg espeak-ng
          mkdir -p android/app/src/androidTest/assets
          espeak-ng -w /tmp/cuplik-speech.wav "This is a video editing test. We prepare the tools, follow each step, and check the result carefully."
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=24:duration=8 -i /tmp/cuplik-speech.wav -af apad -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac android/app/src/androidTest/assets/source.mp4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cuplik/ggml-tiny.bin
          key: cuplik-whisper-tiny-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      - name: Download or validate cached Whisper test model
        timeout-minutes: 8
        run: bash scripts/ci_whisper_model.sh
      - name: Compile instrumentation before starting emulator
        run: ./gradlew assembleDebugAndroidTest --no-daemon
        working-directory: android
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cuplik-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-failure-reports
          path: android/app/build/reports
  signed-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_apk && github.actor == github.repository_owner
    needs: [web, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: android/third_party/whisper.cpp
          persist-credentials: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: npm ci --prefix web
      - run: npm run build:android-ui --prefix web
      - run: cp android/third_party/whisper.cpp/LICENSE android/app/src/main/assets/whisper-LICENSE.txt
      - name: Build and verify stable signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.CUPLIK_ANDROID_KEYSTORE }}
          CUPLIK_SIGNING_PASSWORD: ${{ secrets.CUPLIK_ANDROID_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_path="$RUNNER_TEMP/cuplik-signing.p12"
          trap 'rm -f "$signing_path"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$CUPLIK_SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          unset KEYSTORE_BASE64
          export CUPLIK_SIGNING_STORE="$signing_path"
          cd android
          ./gradlew assembleRelease lintRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/cuplik-cert.txt"
          expected=$(tr -d '\r\n' < signing-cert.sha256)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cuplik-cert.txt")
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          cd ..
          python3 scripts/package_android.py --build android/app/build/outputs/apk/release --output artifacts/android --certificate android/signing-cert.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cuplik-android-signed
          path: artifacts/android/
          if-no-files-found: error
  foundation:
    if: always()
    needs: [web, android, signed-apk]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          WEB_RESULT: ${{ needs.web.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          SIGNING_RESULT: ${{ needs.signed-apk.result }}
          SIGNING_REQUESTED: ${{ inputs.build_signed_apk || false }}
        run: |
          test "$WEB_RESULT" = success
          test "$ANDROID_RESULT" = success
          if [ "$SIGNING_REQUESTED" = true ]; then
            test "$SIGNING_RESULT" = success
          else
            test "$SIGNING_RESULT" = skipped
          fi
