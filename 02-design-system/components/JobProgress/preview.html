<!-- @dsCard group="Status" height=290 subtitle="Tahapan pipeline dengan persen nyata" -->
<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"><style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:22px}.mono{font-family:var(--font-mono)}
.w{padding:var(--space-6);max-width:520px}
.s{display:grid;grid-template-columns:22px 1fr auto;gap:var(--space-3);align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.d{width:12px;height:12px;border-radius:var(--radius-pill);border:2px solid var(--line);justify-self:center}
.done .d{background:var(--score-high);border-color:var(--score-high)}
.run .d{background:var(--brand);border-color:var(--brand)}
.n{font-size:14px}.done .n,.wait .n{color:var(--ink-muted)}.run .n{font-weight:700}
.p{font:500 12px var(--font-mono);color:var(--ink-muted)}
.bar{grid-column:2/4;height:6px;background:var(--surface-raised);border-radius:var(--radius-pill);overflow:hidden}
.bar i{display:block;height:100%;width:41%;background:var(--brand)}
</style></head><body><div class="w">
<div class="s done"><span class="d"></span><span class="n">Mengunduh video</span><span class="p">412 MB</span></div>
<div class="s done"><span class="d"></span><span class="n">Ekstrak audio</span><span class="p">0:08</span></div>
<div class="s run"><span class="d"></span><span class="n">Mentranskrip (Indonesia)</span><span class="p">41%</span><span class="bar"><i></i></span></div>
<div class="s wait"><span class="d"></span><span class="n">Mencari momen terbaik</span><span class="p">—</span></div>
<div class="s wait"><span class="d"></span><span class="n">Reframe 9:16 + lacak wajah</span><span class="p">—</span></div>
<div class="s wait"><span class="d"></span><span class="n">Render caption & ekspor</span><span class="p">—</span></div>
</div></body></html>
