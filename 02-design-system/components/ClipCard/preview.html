<!-- @dsCard group="Klip" height=470 subtitle="Kartu hasil klip di grid" -->
<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"><style>body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:22px}.mono{font-family:var(--font-mono)}
.grid{display:grid;grid-template-columns:repeat(2,220px);gap:var(--space-4);padding:var(--space-6)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.card:hover{background:var(--surface-raised)}
.thumb{aspect-ratio:9/16;max-height:300px;width:100%;position:relative;background:var(--surface-raised);display:flex;align-items:flex-end;justify-content:center}
.thumb .cap{font-weight:800;font-size:15px;text-transform:uppercase;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;margin-bottom:56px;text-align:center;padding:0 12px}
.thumb .cap b{color:var(--caption-hl)}
.rank{position:absolute;top:8px;left:8px;background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:var(--radius-pill)}
.score{position:absolute;top:8px;right:8px;font-family:var(--font-mono);font-weight:700;font-size:13px;padding:2px 8px;border-radius:var(--radius-pill);color:var(--on-brand)}
.dur{position:absolute;bottom:8px;right:8px;background:var(--bg);color:var(--ink);font-family:var(--font-mono);font-size:12px;padding:2px 6px;border-radius:var(--radius-sm)}
.body{padding:var(--space-3) var(--space-4) var(--space-4)}
.t{font-weight:700;font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{font-size:12px;color:var(--ink-muted);margin-top:4px}
.acts{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.btn{flex:1;font:600 13px var(--font-sans);border-radius:var(--radius-md);padding:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.p{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style></head><body><div class="grid">
<div class="card"><div class="thumb"><span class="rank">#1</span><span class="score" style="background:var(--score-high)">9.2</span><div class="cap">modal <b>bukan</b> masalah utamanya</div><span class="dur">0:48</span></div>
<div class="body"><div class="t">Modal bukan masalah utama UMKM — ini yang bikin gagal</div><div class="m mono">12:41 → 13:29 · 9:16</div>
<div class="acts"><button class="btn p">Unduh</button><button class="btn">Edit</button></div></div></div>
<div class="card"><div class="thumb"><span class="rank">#4</span><span class="score" style="background:var(--score-mid)">6.8</span><div class="cap">cek <b>tiga</b> angka ini</div><span class="dur">1:12</span></div>
<div class="body"><div class="t">Tiga angka yang harus kamu cek tiap bulan</div><div class="m mono">31:05 → 32:17 · 9:16</div>
<div class="acts"><button class="btn p">Unduh</button><button class="btn">Edit</button></div></div></div>
</div></body></html>
