<!doctype html><html><head><link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html,body{margin:0}
.c{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;inset:0}
.brand{fill:var(--brand)}.hi{fill:var(--score-high)}.cut{fill:var(--cut)}.raised{fill:var(--surface-raised)}.ink{fill:var(--ink)}
.perf{fill:var(--bg)}
.t{position:absolute;left:48px;bottom:44px;max-width:440px}
.n{font-weight:800;font-size:120px;line-height:.92;letter-spacing:-4px;color:var(--ink)}
.g{font-size:14px;line-height:20px;color:var(--ink-muted);margin-top:16px}
</style></head><body><div class="c">
<svg viewBox="0 0 960 300" width="960" height="300">
<!--
blocks: brand 144×256 (9:16 clip), score-high 112×200, raised 96×176, ink 64×112, cut 48×84 bleeding right — all rx = radius-lg (16) except cut rx = radius-md
arrangement: staggered stack of vertical 9:16 slabs, the brand slab bleeding off the top, like ranked clips falling out of one long video
pattern: literal motif — film perforations cut out of the brand slab (two columns, pitch space-6 = 24px, holes 8×12 rx radius-sm/3); chosen because Cuplik cuts film into clips
scales: gap space-4 (16), pitch space-6 (24), radii radius-lg 16 / radius-md 10
-->
<rect class="brand" x="512" y="-24" width="144" height="256" rx="16"/>
<g class="perf">
<rect x="522" y="8" width="8" height="12" rx="2"/><rect x="522" y="32" width="8" height="12" rx="2"/><rect x="522" y="56" width="8" height="12" rx="2"/><rect x="522" y="80" width="8" height="12" rx="2"/><rect x="522" y="104" width="8" height="12" rx="2"/><rect x="522" y="128" width="8" height="12" rx="2"/><rect x="522" y="152" width="8" height="12" rx="2"/><rect x="522" y="176" width="8" height="12" rx="2"/><rect x="522" y="200" width="8" height="12" rx="2"/>
<rect x="638" y="8" width="8" height="12" rx="2"/><rect x="638" y="32" width="8" height="12" rx="2"/><rect x="638" y="56" width="8" height="12" rx="2"/><rect x="638" y="80" width="8" height="12" rx="2"/><rect x="638" y="104" width="8" height="12" rx="2"/><rect x="638" y="128" width="8" height="12" rx="2"/><rect x="638" y="152" width="8" height="12" rx="2"/><rect x="638" y="176" width="8" height="12" rx="2"/><rect x="638" y="200" width="8" height="12" rx="2"/>
</g>
<rect class="hi" x="672" y="56" width="112" height="200" rx="16"/>
<rect class="raised" x="800" y="104" width="96" height="176" rx="16"/>
<rect class="ink" x="800" y="24" width="64" height="64" rx="16"/>
<rect class="cut" x="912" y="24" width="64" height="112" rx="10"/>
</svg>
<div class="t"><div class="n">Cuplik</div><div class="g">Satu video panjang masuk, klip vertikal siap posting keluar.</div></div>
</div></body></html>
